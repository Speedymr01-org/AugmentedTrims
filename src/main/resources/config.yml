# AugmentedTrims - config.yml
#
# Passive trim powers live in trims.yml (separate file, hot-reloadable with /trims reload).
# Ability tuning lives here.

config-version: 2

settings:
  # How often equipped armour is re-evaluated. 20 ticks = 1 second.
  # Lower = more responsive, higher = cheaper. Minimum enforced: 5.
  refresh-interval-ticks: 20

  # Trim-granted effects are re-applied every refresh; this buffer is added to
  # the effective duration so effects never visibly flicker between refreshes.
  duration-buffer-ticks: 40

  # Visual flags for trim-granted potion effects.
  ambient: true
  particles: false
  icon: true

  # Remove the effect the moment the last matching armour piece is taken off.
  remove-on-unequip: true

  # Verbose logging of tier resolution (very chatty - debugging only).
  debug: false

abilities:
  # Copper - Thunderstrike: lightning on the block you are looking at, never sets fire.
  # Damage uses the vanilla lightning damage type, which bypasses armour.
  copper:
    range: 30.0
    radius: 3.0
    damage-caster: false
    # true  = magic damage, which vanilla lists in bypasses_armor (message: "killed by magic")
    # false = vanilla lightning damage, which armour DOES reduce
    ignore-armour: true
    tiers:
      "1":
        damage: 15.0
        cooldown: 55
      "2":
        damage: 15.0
        cooldown: 55
      "3":
        damage: 15.0
        cooldown: 55
      "4":
        damage: 15.0
        cooldown: 55

  # Iron - Arrow Torrent: 4 arrows/second tracking the crosshair, blockable by terrain.
  iron:
    arrow:
      speed: 3.0
      spread-degrees: 1.5
      damage: 4.0
    tiers:
      "1":
        arrows-per-second: 2
        duration-seconds: 3
        cooldown: 55
      "2":
        arrows-per-second: 3
        duration-seconds: 4
        cooldown: 50
      "3":
        arrows-per-second: 3
        duration-seconds: 5
        cooldown: 45
      "4":
        arrows-per-second: 4
        duration-seconds: 5
        cooldown: 40

  # Quartz - Refract: incoming projectiles bounce back along a solved ballistic arc.
  # Tiers 1-3 solve the arc once; tier 4 re-solves every tick (homing).
  quartz:
    projectile:
      speed-multiplier: 1.2
      # A projectile reflected this recently cannot be reflected again (anti ping-pong).
      reflection-min-interval-ticks: 10
      arc:
        min-flight-ticks: 8
        max-flight-ticks: 40
    tiers:
      "1":
        duration-seconds: 2.0
        max-reflections: 2
        cooldown: 90
        homing: false
      "2":
        duration-seconds: 2.5
        max-reflections: 3
        cooldown: 80
        homing: false
      "3":
        duration-seconds: 3.0
        max-reflections: 4
        cooldown: 70
        homing: false
      "4":
        duration-seconds: 4.0
        max-reflections: 5
        cooldown: 60
        homing: true

  # Resin - Cobweb Shot: one cobweb thrown along your view direction.
  # It becomes a real cobweb block on the first surface it touches, deals no damage and
  # never drops an item.
  resin:
    speed: 1.6
    gravity: 0.04
    max-flight-ticks: 120
    tiers:
      "1":
        cooldown: 30
      "2":
        cooldown: 23
      "3":
        cooldown: 17
      "4":
        cooldown: 10

  # Redstone - EMP: a one tick pulse through every block in a 3D sphere around you.
  # Redstone wire jumps to full power, levers/buttons/rails read as powered, redstone lamps and
  # torches light, doors/trapdoors/gates open and TNT is primed. Every change is reverted on the
  # next tick, so it is a pulse and never a permanent rewire. Ignores walls.
  redstone:
    # Always 55 seconds, whatever the tier.
    cooldown: 55
    # Fuse given to TNT the pulse ignites (vanilla default is 80).
    tnt-fuse-ticks: 80
    # How long the pulse holds the blocks in their powered state before they are restored.
    # 20 ticks = one second. A single tick is invisible, so keep it at 20 or more.
    pulse-ticks: 20
    # How the pulse reaches the blocks the wires feed:
    #   false (default) - the plugin works the network out itself: every wire in the sphere is a
    #                     source with power 15, the power travels along the wires and everything
    #                     next to a live wire is powered. No block is ever placed.
    #   true            - temporary blocks of redstone are placed instead, so the vanilla engine
    #                     reacts exactly like a real signal (pistons push, observers fire, ...).
    real-sources: false
    # Safety cap on how many temporary blocks a single pulse may place.
    max-sources: 64
    # Show how far the pulse reaches: a wall of red sparks on the shell of the sphere. They
    # appear at once, sink straight down without any sideways movement, slow down and fade.
    range-visual: true
    # How many sparks sit on one block of the wall. A bigger radius gets a bigger wall, but the
    # spacing between the sparks stays the same.
    range-visual-density: 0.8
    # Sphere radius in blocks per tier: 4, 6, 8, 10 (= 4 + 2 per tier).
    radius:
      "1": 4.0
      "2": 6.0
      "3": 8.0
      "4": 10.0

  # Netherite - Dread Aura: a TOGGLE. While on, every player inside the radius is blinded
  # and nauseated. The effect is always applied for the same fixed duration, so leaving the
  # radius does not clear it instantly - it just stops being refreshed and runs out.
  netherite:
    # How often the aura is re-applied while it is on. Needs a server restart to change.
    interval-ticks: 20
    # Flat cost of toggling on OR off (both directions).
    cooldown: 1
    # Always 5 seconds, independent of radius. Never shorter, or the effect would
    # disappear the moment someone steps out of range.
    effect-duration-ticks: 100
    # 0 = level I.
    amplifier: 0
    # Blind the wearer too. Off by default so the aura only hits everyone else.
    affect-self: false
    # Start enabled the moment netherite-trimmed armour is worn, without right-clicking.
    # The star then toggles it off/on. Leave false for "toggle it on when you want it".
    default-enabled: false
    # Radius in blocks per tier: 1, 2.5, 4, 5.5 (= 1 + 1.5 per tier).
    radius:
      "1": 1.0
      "2": 2.5
      "3": 4.0
      "4": 5.5

messages:
  prefix: "&8[&6AugmentedTrims&8] &r"
  header: "&6Trim powers for &e%player%"
  line: "&8- &f%material% &8x&f%pieces% &7-> &ftier %tier%"
  line-unknown: "&8- &f%material% &8x&f%pieces% &7-> &7no powers configured"
  no-trims: "&7No powered trim materials equipped."
  reloaded: "&aReloaded config.yml and trims.yml."
  no-permission: "&cYou don't have permission to do that."
  player-not-found: "&cPlayer not found: &f%player%"
  give: "&aGave &f%amount%x %item% &ato &f%player%&a."
  give-usage: "&cUsage: /trims give <formless|material> [player]"
  cooldown-cleared: "&aCleared ability cooldowns for &f%player%&a."
  ability:
    activated: "&aAbility activated."
    on-cooldown: "&cAbility on cooldown."
    # Shown when the player wears no armour of that material: the star has no power without it.
    no-armour: "&cYou need %material% trim armour to power this star."
    not-attuned: "&cThis star is not attuned."
    no-target: "&cNo block in range."
    aura-on: "&5Dread aura enabled."
    aura-off: "&7Dread aura disabled."
    aura-ended: "&7Dread aura ended - no netherite trim equipped."
